name: splitmate-phase1
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitmate_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-splitmate}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - splitmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      target: backend
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-splitmate}:${POSTGRES_PASSWORD:-splitmate_local_only}@db:5432/${POSTGRES_DB:-splitmate}?schema=public
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  frontend:
    build:
      context: .
      target: frontend
    environment:
      API_PROXY_TARGET: http://backend:3001
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: splitmate
      POSTGRES_PASSWORD: splitmate_test_only
      POSTGRES_DB: splitmate_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U splitmate -d splitmate_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  splitmate_pgdata:

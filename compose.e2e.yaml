# Separate project, database and tmpfs: never attaches to the application's data volume.
name: splitmate-e2e
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: splitmate
      POSTGRES_PASSWORD: splitmate_e2e_only
      POSTGRES_DB: splitmate_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U splitmate -d splitmate_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: e2e
    environment:
      DATABASE_URL: postgresql://splitmate:splitmate_e2e_only@db:5432/splitmate_test?schema=public
      TEST_DATABASE_URL: postgresql://splitmate:splitmate_e2e_only@db:5432/splitmate_test?schema=public
      CHECKPOINT_DISABLE: "1"
      CI: "true"
    depends_on:
      db:
        condition: service_healthy
    # Browser/network isolation is local to this project; no application ports exposed.
    volumes:
      - ./.local/playwright-report:/app/playwright-report
      - ./.local/test-results:/app/test-results
    shm_size: 1gb
    init: true
    command: ["sh", "-c", "npm run db:deploy && npm run lint && npm run typecheck && npm test && npm run test:integration && npm run build && npm run check:bundle && npm run test:e2e && npm run test:production && npm exec -w @splitmate/backend -- prisma migrate status && npm exec -w @splitmate/backend -- prisma validate && npm exec -w @splitmate/backend -- prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code"]

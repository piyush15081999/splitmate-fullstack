name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: splitmate
          POSTGRES_PASSWORD: splitmate_ci_only
          POSTGRES_DB: splitmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitmate -d splitmate_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://splitmate:splitmate_ci_only@localhost:5432/splitmate_test?schema=public
      TEST_DATABASE_URL: postgresql://splitmate:splitmate_ci_only@localhost:5432/splitmate_test?schema=public
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: node scripts/check-repository.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm exec -w @splitmate/backend -- prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:deploy
      - run: npm run test:integration
      - name: Build Render profile without migration credentials
        run: npm run build:render
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://fictional:render_check_only@ep-fictional-pooler.eu-west-2.aws.neon.tech/splitmate_build_only?sslmode=require
          DIRECT_URL: ""
          DIRECT_DATABASE_URL: ""
      - run: npm exec -w @splitmate/backend -- prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 3

# Preparation only: importing this Blueprint creates a public service and requires owner approval.
services:
  - type: web
    name: splitmate-fullstack
    repo: https://github.com/piyush15081999/splitmate-fullstack
    branch: main
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build:render
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
